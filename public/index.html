<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f6f7f4"><title>Texta · 登录</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="stylesheet" href="./workspace.css?v=20261004"><link rel="stylesheet" href="./controls.css?v=20261005-controls1"><script src="./theme.js?v=20261005-controls1"></script><script src="./i18n.js?v=20261004" defer></script></head>
<body class="auth-page"><header class="site-header"><a class="wordmark" href="./index.html">Texta</a><div class="header-tools"><button type="button" class="language-toggle" aria-label="切换界面语言">中文 / EN</button><button id="authHelpBtn" type="button">帮助</button></div></header>
<main class="auth-page-wrap"><section class="auth-card"><h1>登录 Texta</h1><div class="auth-tabs" role="tablist" aria-label="账户操作"><button id="tabLogin" class="auth-tab active" type="button" role="tab" aria-controls="loginForm" aria-selected="true">登录</button><button id="tabRegister" class="auth-tab" type="button" role="tab" aria-controls="registerForm" aria-selected="false">注册</button></div>
<p id="authMsg" class="auth-msg" role="status" aria-live="polite"></p>
<form id="loginForm" class="auth-form" role="tabpanel" aria-labelledby="tabLogin"><label for="loginEmail">邮箱</label><input id="loginEmail" type="email" placeholder="example@email.com" autocomplete="username" required><div class="auth-label-row"><label for="loginPassword">密码</label><button id="forgotPasswordBtn" class="text-btn" type="button">忘记密码？</button></div><div class="password-field"><input id="loginPassword" type="password" placeholder="请输入密码" autocomplete="current-password" required><button type="button" class="password-toggle" aria-label="显示密码" data-password-target="loginPassword"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button id="loginBtn" class="primary-btn" type="submit">登录并进入</button></form>
<form id="registerForm" class="auth-form hidden" role="tabpanel" aria-labelledby="tabRegister"><label for="registerName">用户名</label><input id="registerName" type="text" placeholder="请输入你的用户名" autocomplete="nickname" maxlength="60"><label for="registerEmail">邮箱</label><input id="registerEmail" type="email" placeholder="example@email.com" autocomplete="username" required><label for="registerPassword">密码</label><div class="password-field"><input id="registerPassword" type="password" placeholder="至少 6 位密码" autocomplete="new-password" minlength="6" required><button type="button" class="password-toggle" aria-label="显示密码" data-password-target="registerPassword"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c3-5 6-7 10-7s7 2 10 7c-3 5-6 7-10 7s-7-2-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button id="registerBtn" class="primary-btn" type="submit">注册并进入</button></form>
</section></main><script src="./site-config.js?v=20261004"></script><script src="./auth.js?v=20261005-controls1"></script></body></html>
