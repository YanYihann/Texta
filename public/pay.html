<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Texta VIP 支付</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.svg" />
  <link rel="stylesheet" href="./workspace.css?v=20261004" /><link rel="stylesheet" href="./controls.css?v=20261005-controls1"><script src="./theme.js?v=20261005-controls1"></script>
<script src="./i18n.js?v=20261004" defer></script>
</head>
  <body class="auth-page payment-page">
<header class="site-header"><a class="wordmark" href="./app.html">Texta</a><div class="header-tools"><a href="./app.html">返回主页面</a><button class="language-toggle" type="button" aria-label="切换界面语言">中文 / EN</button></div></header>
    <main class="auth-page-wrap">
      <section class="auth-card solo pay-card">
        <h1>升级 VIP</h1>
        <p class="auth-subtitle">支付 10 元可升级 VIP（每日 50 次）</p>

        <div class="pay-box">
          <div class="pay-title">收款码</div>
          <div class="pay-qr-placeholder">
            <img id="payQrImage" src="./assets/pay-qr.jpg" alt="收款码" />
          </div>
          <p class="pay-tip">扫码付款后，提交支付凭证供管理员审核。</p>
        </div>

        <div id="payMsg" class="auth-msg" role="status" aria-live="polite"></div>
        <label for="payerName">付款人昵称</label>
        <input id="payerName" type="text" placeholder="例如：张三" />
        <label for="proofCode">支付凭证号（可选）</label>
        <input id="proofCode" type="text" placeholder="例如：订单号/转账单号" />
        <label for="proofImageUrl">凭证图片链接（可选）</label>
        <input id="proofImageUrl" type="text" placeholder="粘贴图片URL，或先留空" />
        <label for="proofNote">备注（可选）</label>
        <input id="proofNote" type="text" placeholder="补充说明" />
        <button id="submitVipRequestBtn" class="primary-btn" type="button">提交支付凭证</button>
        <a class="upgrade-link" href="./app.html">返回主页面</a>
      </section>
    </main>

    <script src="./site-config.js?v=2026.03.25.181412"></script>
    <script src="./pay.js?v=20261005-controls1"></script>
  </body>
</html>
