name: Core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix frontend-react
      - run: npm run lint --prefix frontend-react
      - run: npm test --prefix frontend-react
      - run: npm run build --prefix frontend-react
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api-texta.yanyihan.top
